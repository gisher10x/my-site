<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cloud-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa5f5"/>
      <stop offset="1" stop-color="#1d64b8"/>
    </linearGradient>
    <linearGradient id="cloud-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cloud-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f2341" flood-opacity="0.28"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f2341" flood-opacity="0.16"/>
    </filter>
  </defs>

  <style>
    .link {
      fill: none;
      stroke: #5aa5f5;
      stroke-width: 2.5;
      stroke-linecap: round;
      opacity: 0.75;
    }
    .side-link {
      fill: none;
      stroke: #5aa5f5;
      stroke-width: 1.5;
      stroke-dasharray: 3 6;
      stroke-linecap: round;
      opacity: 0.45;
    }
    /* A zero-length dash with a round cap draws a dot; moving the dash offset moves it along the curve. */
    .flow {
      fill: none;
      stroke: #1d64b8;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 0 100;
      stroke-dashoffset: -55;
      animation: flow 5s linear infinite;
    }
    .flow-green { stroke: #2f9e5b; }
    .d1 { animation-delay: 0s; }
    .d2 { animation-delay: -0.8s; }
    .d3 { animation-delay: -1.7s; }
    .d4 { animation-delay: -2.5s; }
    .d5 { animation-delay: -3.3s; }
    .d6 { animation-delay: -4.2s; }
    @keyframes flow {
      0%   { stroke-dashoffset: 0;    opacity: 0; }
      15%  {                          opacity: 0.9; }
      85%  {                          opacity: 0.9; }
      100% { stroke-dashoffset: -100; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; opacity: 0.9; }
    }

    .card {
      fill: #ffffff;
      stroke: #c9daee;
      stroke-width: 1.5;
    }
    .icon-bg { fill: #e0eefd; }
    .icon-bg-green { fill: #e3f4e9; }
    .icon {
      fill: none;
      stroke: #1d64b8;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-solid { fill: #1d64b8; stroke: none; }
    .icon-green { stroke: #2f9e5b; }
    .label {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #1e293b;
      text-anchor: middle;
      direction: rtl;
    }
    .cloud-text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      fill: #ffffff;
      text-anchor: middle;
    }
  </style>

  <!-- Faint lines between neighbouring nodes -->
  <path class="side-link" d="M252 50 Q322 50 336 88"/>
  <path class="side-link" d="M64 318 Q76 350 148 350"/>

  <!-- Connections from the cloud to each node -->
  <path class="link" d="M200 205 Q188 140 200 87"/>
  <path class="link" d="M200 205 Q270 190 284 150"/>
  <path class="link" d="M200 205 Q270 225 284 262"/>
  <path class="link" d="M200 205 Q212 270 200 313"/>
  <path class="link" d="M200 205 Q130 225 116 262"/>
  <path class="link" d="M200 205 Q130 190 116 150"/>

  <!-- Travelling data dots -->
  <path class="flow d1" pathLength="100" d="M200 205 Q188 140 200 87"/>
  <path class="flow d2" pathLength="100" d="M200 205 Q270 190 284 150"/>
  <path class="flow d3" pathLength="100" d="M200 205 Q270 225 284 262"/>
  <path class="flow d4" pathLength="100" d="M200 205 Q212 270 200 313"/>
  <path class="flow flow-green d5" pathLength="100" d="M200 205 Q130 225 116 262"/>
  <path class="flow d6" pathLength="100" d="M200 205 Q130 190 116 150"/>

  <!-- Central cloud -->
  <g filter="url(#cloud-shadow)">
    <path fill="url(#cloud-fill)" d="M160 240 H240 A25 25 0 0 0 244 190.5 A33 33 0 0 0 183 175 A23 23 0 0 0 155 196 A22 22 0 0 0 160 240 Z"/>
  </g>
  <path fill="url(#cloud-shine)" d="M168 196 A16 16 0 0 1 186 182 A27 27 0 0 1 234 192 Q200 186 168 196 Z"/>
  <text class="cloud-text" x="200" y="226">CRM</text>

  <!-- Node: אוטומציה (top) -->
  <g transform="translate(200 50)">
    <rect class="card" x="-52" y="-37" width="104" height="74" rx="14" filter="url(#card-shadow)"/>
    <circle class="icon-bg" cx="0" cy="-13" r="15"/>
    <path class="icon-solid" transform="translate(0 -13)" d="M2 -10 L-7 2 H-1 L-2 10 L7 -2 H1 Z"/>
    <text class="label" x="0" y="27">אוטומציה</text>
  </g>

  <!-- Node: נתונים (top right) -->
  <g transform="translate(336 125)">
    <rect class="card" x="-52" y="-37" width="104" height="74" rx="14" filter="url(#card-shadow)"/>
    <circle class="icon-bg" cx="0" cy="-13" r="15"/>
    <g class="icon" transform="translate(0 -13)">
      <ellipse cx="0" cy="-6" rx="7.5" ry="3"/>
      <path d="M-7.5 -6 V6 A7.5 3 0 0 0 7.5 6 V-6"/>
      <path d="M-7.5 0 A7.5 3 0 0 0 7.5 0"/>
    </g>
    <text class="label" x="0" y="27">נתונים</text>
  </g>

  <!-- Node: דוחות (bottom right) -->
  <g transform="translate(336 281)">
    <rect class="card" x="-52" y="-37" width="104" height="74" rx="14" filter="url(#card-shadow)"/>
    <circle class="icon-bg" cx="0" cy="-13" r="15"/>
    <g transform="translate(0 -13)">
      <rect class="icon-solid" x="-8" y="1" width="4" height="7" rx="1"/>
      <rect class="icon-solid" x="-2" y="-4" width="4" height="12" rx="1"/>
      <rect class="icon-solid" x="4" y="-8" width="4" height="16" rx="1"/>
    </g>
    <text class="label" x="0" y="27">דוחות</text>
  </g>

  <!-- Node: אינטגרציות (bottom) -->
  <g transform="translate(200 350)">
    <rect class="card" x="-52" y="-37" width="104" height="74" rx="14" filter="url(#card-shadow)"/>
    <circle class="icon-bg" cx="0" cy="-13" r="15"/>
    <g class="icon" transform="translate(0 -13)">
      <path d="M-8 -4 H7 M3 -8 L7 -4 L3 0"/>
      <path d="M8 4 H-7 M-3 0 L-7 4 L-3 8"/>
    </g>
    <text class="label" x="0" y="27">אינטגרציות</text>
  </g>

  <!-- Node: בדיקות (bottom left, green accent) -->
  <g transform="translate(64 281)">
    <rect class="card" x="-52" y="-37" width="104" height="74" rx="14" filter="url(#card-shadow)"/>
    <circle class="icon-bg-green" cx="0" cy="-13" r="15"/>
    <g class="icon icon-green" transform="translate(0 -13)">
      <circle cx="0" cy="0" r="8.5"/>
      <path d="M-4 0.5 L-1 3.5 L4.5 -2.5"/>
    </g>
    <text class="label" x="0" y="27">בדיקות</text>
  </g>

  <!-- Node: הרשאות (top left) -->
  <g transform="translate(64 125)">
    <rect class="card" x="-52" y="-37" width="104" height="74" rx="14" filter="url(#card-shadow)"/>
    <circle class="icon-bg" cx="0" cy="-13" r="15"/>
    <g class="icon" transform="translate(0 -13)">
      <rect x="-7" y="-2" width="14" height="10" rx="2"/>
      <path d="M-4 -2 V-5 A4 4 0 0 1 4 -5 V-2"/>
    </g>
    <text class="label" x="0" y="27">הרשאות</text>
  </g>
</svg>
