    <line x1="120" y1="120" x2="40" y2="44"/>
    <line x1="120" y1="120" x2="204" y2="52"/>
    <line x1="120" y1="120" x2="28" y2="150"/>
    <line x1="120" y1="120" x2="210" y2="160"/>
    <line x1="120" y1="120" x2="84" y2="214"/>
    <line x1="120" y1="120" x2="168" y2="216"/>
